<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Fotos – Galeria (Todas + Filtros)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS ORIGINAL (mantido exatamente) -->
  <style>
    :root{--bg:#f8fafc;--card:#ffffff;--accent:#6366f1;--sel:#e0e7ff;--text:#1e293b;--muted:#64748b}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding-bottom:120px}
    header{text-align:center;padding:80px 20px 60px;background:linear-gradient(135deg,#e0e7ff,#c7d2fe)}
    h1{font-size:2.8rem;color:#4338ca;margin-bottom:10px}
    .subtitle{font-size:1.1rem;color:#4c1d95;font-weight:500}

    .gallery{
      column-count:5;column-gap:24px;max-width:1800px;margin:24px auto 120px;padding:0 24px;
    }
    .photo{
      display:inline-block;width:100%;margin-bottom:28px;background:var(--card);border-radius:20px;
      overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.08);border:3px solid transparent;
      transition:all .3s;cursor:pointer;position:relative;break-inside:avoid;
    }
    .photo.selected{border-color:var(--accent);box-shadow:0 0 0 5px var(--sel)}
    .photo::after{
      content:"Checkmark";position:absolute;top:14px;right:14px;width:40px;height:40px;
      background:var(--accent);color:white;border-radius:50%;font-size:26px;line-height:40px;
      text-align:center;opacity:0;transition:.3s;
    }
    .photo.selected::after{opacity:1}
    .photo img{width:100%;height:auto;display:block;border-radius:20px 20px 0 0;object-fit:cover}
    .caption{padding:20px;text-align:center}
    .caption h3{font-size:1.1rem;font-weight:600;margin-bottom:6px}
    .caption p{font-size:0.95rem;color:var(--muted)}

    .fab{
      position:fixed;bottom:30px;right:30px;background:var(--accent);color:white;
      width:70px;height:70px;border-radius:50%;border:none;font-size:32px;
      box-shadow:0 12px 40px rgba(99,102,241,0.5);cursor:pointer;z-index:1000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
    }
    .fab:hover{transform:scale(1.12)}
    .fab .count{
      position:absolute;top:-10px;right:-10px;background:#ef4444;color:white;
      font-size:14px;font-weight:bold;width:32px;height:32px;border-radius:50%;
      line-height:32px;
    }

    .controls {
      max-width:1800px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
    }
    .controls input[type="search"]{padding:8px 12px;border-radius:8px;border:1px solid #e6e9ef;width:280px}
    .controls button{padding:8px 12px;border-radius:8px;border:1px solid #e6e9ef;background:white;cursor:pointer}
    .controls .small{padding:6px 10px;font-size:13px}

    @media(max-width:1600px){.gallery{column-count:4}}
    @media(max-width:1200px){.gallery{column-count:3}}
    @media(max-width:900px){.gallery{column-count:2}}
    @media(max-width:600px){.gallery{column-count:1;padding:0 16px}}
  </style>
</head>
<body>

<header>
  <h1>Minhas Fotos</h1>
  <p class="subtitle">Clique nas fotos para selecionar → Gere o relatório em PDF (apenas nomes)</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Buscar por nome (ex.: DSC004)..." />
  <button id="btnShowAll" class="small">Mostrar todos</button>
  <button id="btnShowSelected" class="small">Mostrar apenas selecionados</button>
  <button id="selectAll" class="small">Selecionar tudo (visíveis)</button>
  <button id="clearSelection" class="small">Limpar seleção</button>
  <div style="min-width:80px;text-align:center;color:#334155">Selecionadas: <strong id="count">0</strong></div>
</div>

<div class="gallery" id="gallery"></div>

<button class="fab" id="fab" type="button" aria-label="Download PDF">
  <div style="font-size:14px;line-height:1;margin-bottom:4px">Download</div>
  <span class="count" id="count-fab">0</span>
</button>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  // helpers

  function escHtml(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

  // cria card
  function createCard(item) {
    const card = document.createElement('div');
    card.className = 'photo';
    card.dataset.name = item.name;
    card.innerHTML = `
      <img loading="lazy" src="${escAttr(item.url)}" alt="${escAttr(item.name)}">
      <div class="caption"><h3>${escHtml(item.name)}</h3><p>Para demonstração</p></div>
    `;
    ensureCheckSpan(card);
    if (selected.has(item.name)) {
      card.classList.add('selected');
      card.querySelector('.js-checkmark').style.opacity = '1';
    }
    return card;
  }

  function ensureCheckSpan(card){
    let s = card.querySelector('.js-checkmark');
    if (!s){
      s = document.createElement('span');
      s.className = 'js-checkmark';
      Object.assign(s.style, {
        position:'absolute', top:'14px', right:'14px', width:'40px', height:'40px',
        background:'var(--accent)', color:'#fff', borderRadius:'50%', fontSize:'26px',
        lineHeight:'40px', textAlign:'center', opacity:'0', transition:'.2s', zIndex:'999', pointerEvents:'none'
      });
      s.textContent = '✓';
      card.appendChild(s);
    }
    return s;
  }

  // renderiza tudo (aplica filtro de search/selecionados)
  function renderAll() {
    gallery.innerHTML = '';
    const frag = document.createDocumentFragment();
    const q = (visibleFilter && typeof visibleFilter === 'string') ? visibleFilter.trim().toLowerCase() : null;
    const showOnlySelected = visibleFilter === 'selected';
    let nVisible = 0;

    for (const item of allPhotos) {
      // decidir visibilidade
      let visible = true;
      if (showOnlySelected) visible = selected.has(item.name);
      else if (q) visible = item.name.toLowerCase().includes(q);

      if (!visible) continue;

      const card = createCard(item);
      frag.appendChild(card);
      nVisible++;
    }

    gallery.appendChild(frag);
    updateCounts();
    // scroll to top to show filter result
    window.scrollTo({top:0,behavior:'smooth'});
    return nVisible;
  }

  function updateCounts() {
    countEl.textContent = selected.size;
    fabCount.textContent = selected.size;
  }

  // delegação clique: seleção
  gallery.addEventListener('click', (ev) => {
    let el = ev.target;
    while (el && !el.classList.contains('photo')) el = el.parentElement;
    if (!el) return;
    const name = el.dataset.name;
    const isNow = el.classList.toggle('selected');
    const s = ensureCheckSpan(el);
    s.style.opacity = isNow ? '1' : '0';
    if (isNow) selected.add(name);
    else selected.delete(name);
    updateCounts();
  });

  // filtros / controles
  searchInput.addEventListener('input', () => {
    const v = searchInput.value.trim();
    visibleFilter = v ? v.toLowerCase() : null;
    renderAll();
  });
  btnShowAll.addEventListener('click', () => { visibleFilter = null; searchInput.value = ''; renderAll(); });
  btnShowSelected.addEventListener('click', () => { visibleFilter = 'selected'; searchInput.value = ''; renderAll(); });
  btnSelectAll.addEventListener('click', () => {
    // seleciona todas as visíveis
    const cards = gallery.querySelectorAll('.photo');
    cards.forEach(c => {
      const name = c.dataset.name;
      if (!selected.has(name)) {
        selected.add(name);
        c.classList.add('selected');
        const s = ensureCheckSpan(c); s.style.opacity = '1';
      }
    });
    updateCounts();
  });
  btnClear.addEventListener('click', () => {
    selected.clear();
    gallery.querySelectorAll('.photo.selected').forEach(c => {
      c.classList.remove('selected');
      const s = c.querySelector('.js-checkmark'); if (s) s.style.opacity = '0';
    });
    updateCounts();
  });

  // gerar PDF apenas com nomes (robusto)
  fab.addEventListener('click', () => {
    if (selected.size === 0) { alert('Selecione pelo menos uma foto primeiro!'); return; }
    const jsPDFCtor = window.jspdf?.jsPDF || window.jsPDF || (window.jspdf && window.jspdf.jsPDF) || null;
    if (!jsPDFCtor) { alert('Erro: jsPDF não disponível. Verifique o CDN.'); return; }
    const pdf = new jsPDFCtor('p','mm','a4');
    const margem = 15;
    let y = 25;
    pdf.setFontSize(20); pdf.setTextColor(67,56,202); pdf.text('Relatório de Seleção', margem, y); y+=10;
    pdf.setFontSize(11); pdf.setTextColor(100,116,139); pdf.text(`Data: ${new Date().toLocaleString('pt-BR')}`, margem, y); y+=8;
    pdf.setFontSize(12); pdf.setTextColor(30,41,59); pdf.text(`Fotos selecionadas: ${selected.size}`, margem, y); y+=10;
    pdf.setDrawColor(220); pdf.setLineWidth(0.4); pdf.line(margem, y, 210-margem, y); y+=8;
    pdf.setFontSize(11);
    const lineHeight = 7;
    let idx = 0;
    for (const name of selected) {
      idx++;
      if (y + lineHeight > 287) { pdf.addPage(); y = 20; }
      pdf.text(`${idx}. ${name}`, margem, y);
      y += lineHeight;
    }
    const filename = `relatorio-nomes-${new Date().toISOString().slice(0,10)}.pdf`;
    pdf.save(filename);
  });

  // inicializa: renderiza tudo
  renderAll();
  updateCounts();

})();
</script>
